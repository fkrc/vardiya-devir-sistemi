# PostgreSQL Bağlantı Ayarları
# NOT: Değerler artık ortam değişkenlerinden okunuyor; ":" sonrası olan kısımlar
# sadece yerel geliştirme için varsayılan değerlerdir. Production'da DB_USERNAME /
# DB_PASSWORD / DB_URL ortam değişkenlerini set edip bu dosyaya gerçek şifre
# commit'lememek gerekir.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vardiya_devir}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}

# JPA / Hibernate Ayarları
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# JSONB tipi uyumluluğu için (İleride esnek formlar için gerekecek)
spring.jpa.properties.hibernate.format_sql=true

# Form eklerine (belge/görsel) izin verilen maksimum dosya ve istek boyutu
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB